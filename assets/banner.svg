<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="1" fill="#374151" fill-opacity="0.5" />
    </pattern>

    <!-- Animated Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; fill-opacity: 0.8; }
        50% { r: 7.5; fill-opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .bg-glow-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .bg-glow-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 750px 180px;
      }
      .circuit-line {
        stroke-dasharray: 12, 12;
        animation: flowLight 25s linear infinite;
      }
      .circuit-fast {
        stroke-dasharray: 8, 8;
        animation: flowLight 12s linear infinite;
      }
      .pulse-dot-1 {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .pulse-dot-2 {
        animation: nodePulse 3.5s ease-in-out infinite 0.7s;
      }
      .pulse-dot-3 {
        animation: nodePulse 4s ease-in-out infinite 1.4s;
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base with Rounded Borders -->
  <rect width="920" height="300" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Background Grid -->
  <rect width="920" height="300" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Blobs in Background (Non-intrusive) -->
  <g opacity="0.4">
    <circle class="bg-glow-1" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle class="bg-glow-2" cx="720" cy="190" r="160" fill="#6366f1" filter="url(#glow)" />
    <circle class="bg-glow-1" cx="480" cy="240" r="100" fill="#a855f7" filter="url(#glow)" />
  </g>

  <!-- Animated Architecture Flow / Pointers (Zero-Copy Visualization) -->
  <g opacity="0.35">
    <!-- Base block to Clone Pointers -->
    <path class="circuit-line" d="M 120 230 L 250 230 L 320 190 L 600 190" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="circuit-fast" d="M 600 190 L 680 140 L 830 140" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="circuit-line" d="M 600 190 L 680 240 L 830 240" fill="none" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- Connection Nodes -->
    <circle class="pulse-dot-1" cx="320" cy="190" r="5" fill="#38bdf8" />
    <circle class="pulse-dot-2" cx="600" cy="190" r="5" fill="#818cf8" />
    <circle class="pulse-dot-3" cx="680" cy="140" r="4" fill="#a855f7" />
    <circle class="pulse-dot-1" cx="680" cy="240" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Badge / Header Pill -->
  <g transform="translate(60, 42)">
    <rect width="260" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="13" r="5" fill="#10b981" />
    <circle cx="14" cy="13" r="8" fill="#10b981" fill-opacity="0.3" />
    <text x="28" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ZERO-COPY ECOSYSTEM 2026</text>
  </g>

  <!-- Foreground Title -->
  <text class="banner-title" x="60" y="112" font-size="34">
    Awesome <tspan fill="url(#primaryGlow)">Zero-Copy Data Cloning</tspan>
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text class="banner-sub" x="60" y="146" font-size="15">
    Curated Guide to Copy-on-Write (CoW), Instant Database Branching, Virtual CDM &amp; Reflink Storage
  </text>

  <!-- Feature Pills / Highlights in Foreground -->
  <g transform="translate(60, 185)">
    <!-- Pill 1: O(1) Cloning -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">⚡ O(1) Instant Clones</text>
    </g>

    <!-- Pill 2: 0 Storage Cost -->
    <g transform="translate(147, 0)">
      <rect width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">💾 Zero Storage Overhead</text>
    </g>

    <!-- Pill 3: Copy-on-Write -->
    <g transform="translate(319, 0)">
      <rect width="155" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🧬 Copy-on-Write (CoW)</text>
    </g>

    <!-- Pill 4: Data Virtualization -->
    <g transform="translate(486, 0)">
      <rect width="168" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#34d399" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🛡️ Test Data Management</text>
    </g>

    <!-- Pill 5: Database Branching -->
    <g transform="translate(666, 0)">
      <rect width="140" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#fbbf24" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🌿 DB Branching</text>
    </g>
  </g>

  <!-- Bottom Mini-Footer Bar inside Banner -->
  <g transform="translate(60, 252)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
      Covering Snowflake • Google Cloud Actifio • NetApp • Pure Storage • Rubrik • Neon • OpenZFS • DVC • LakeFS
    </text>
  </g>
</svg>
